<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meteor Dodge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090a0f;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      overflow: hidden;
    }
    #gameCard {
      max-width: 360px;
      margin: 10px auto;
      position: relative;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      font-weight: bold;
      font-size: 18px;
      color: #38bdf8;
    }
    canvas {
      background: #111827;
      border: 2px solid #374151;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding: 0 10px;
    }
    .btn-ctrl {
      background: #3b82f6;
      color: white;
      border: none;
      width: 45%;
      padding: 15px;
      font-size: 24px;
      border-radius: 12px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .btn-ctrl:active { background: #2563eb; }
    #restartBtn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px;
      font-size: 18px;
      border-radius: 10px;
      width: 90%;
      margin-top: 10px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div id="gameCard">
    <div class="hud">
      <span>LEVEL: <span id="lvl">1</span></span>
      <span>SKOR: <span id="score">0</span></span>
    </div>

    <canvas id="canvas" width="320" height="400"></canvas>

    <div class="controls">
      <button class="btn-ctrl" onmousedown="moveLeft()" ontouchstart="moveLeft()">◀ KIRI</button>
      <button class="btn-ctrl" onmousedown="moveRight()" ontouchstart="moveRight()">KANAN ▶</button>
    </div>

    <button id="restartBtn" onclick="resetGame()">🔄 MAIN LAGI</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 140, y: 350, size: 30, speed: 25 };
    let meteors = [];
    let score = 0;
    let level = 1;
    let gameOver = false;
    let gameInterval, meteorInterval;

    function drawPlayer() {
      ctx.font = "28px sans-serif";
      ctx.fillText("🚀", player.x, player.y + 25);
    }

    function moveLeft() {
      if (gameOver) return;
      if (player.x > 10) player.x -= player.speed;
    }

    function moveRight() {
      if (gameOver) return;
      if (player.x < canvas.width - 35) player.x += player.speed;
    }

    function spawnMeteor() {
      if (gameOver) return;
      let x = Math.random() * (canvas.width - 30);
      let speed = 2 + level * 0.8; // Meteor makin cepat tiap naik level
      meteors.push({ x: x, y: -30, speed: speed });
    }

    function update() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPlayer();

      // Update & Gambar Meteor
      for (let i = 0; i < meteors.length; i++) {
        let m = meteors[i];
        m.y += m.speed;

        ctx.font = "24px sans-serif";
        ctx.fillText("☄️", m.x, m.y);

        // Cek Tabrakan (Hitbox sederhana)
        if (
          m.y + 20 >= player.y &&
          m.y <= player.y + 30 &&
          m.x + 25 >= player.x &&
          m.x <= player.x + 30
        ) {
          endGame();
        }

        // Meteor lolos ke bawah -> Tambah Skor
        if (m.y > canvas.height) {
          meteors.splice(i, 1);
          score += 10;
          document.getElementById('score').innerText = score;

          // Naik Level tiap kelipatan 50 skor
          let newLvl = Math.floor(score / 50) + 1;
          if (newLvl !== level) {
            level = newLvl;
            document.getElementById('lvl').innerText = level;
          }
        }
      }

      requestAnimationFrame(update);
    }

    function endGame() {
      gameOver = true;
      clearInterval(meteorInterval);
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("💥 GAME OVER!", canvas.width / 2, 180);
      ctx.fillStyle = "#fff";
      ctx.font = "16px sans-serif";
      ctx.fillText("Skor Akhir: " + score, canvas.width / 2, 210);

      document.getElementById('restartBtn').style.display = 'block';
    }

    function resetGame() {
      player.x = 140;
      meteors = [];
      score = 0;
      level = 1;
      gameOver = false;
      document.getElementById('score').innerText = '0';
      document.getElementById('lvl').innerText = '1';
      document.getElementById('restartBtn').style.display = 'none';

      clearInterval(meteorInterval);
      meteorInterval = setInterval(spawnMeteor, 600);
      update();
    }

    // Jalankan awal
    resetGame();
  </script>
</body>
</html>
